<style>
/* Layout: one low-resolution arcade screen scaled up in whole pixels, with a CRT scanline and vignette overlay on top. */
:root{
  --bg:#05060f; --panel:#0b1026; --fg:#9fb4d8; --dim:#5a6e9c; --accent:#36e0ff; --hot:#ff4d6d;
  --mono: ui-monospace, "Cascadia Mono", "D2Coding", Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--mono);
  display:flex; align-items:center; justify-content:center;
  box-sizing:border-box; overflow:hidden; user-select:none; -webkit-user-select:none; position:relative;
}
#scr{ position:relative; line-height:0; }
#c{
  display:block; background:#000;
  touch-action:none; outline:none; max-width:100%;
  
}
#crt{
  position:absolute; inset:0; pointer-events:none; background-repeat:repeat;
  background-image:linear-gradient(to bottom, rgba(8,4,24,0) 0, rgba(8,4,24,0) 62%, rgba(8,4,24,.34) 62%, rgba(8,4,24,.34) 100%);
}
#crt::after{ content:""; position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(4,2,16,.5) 100%); }
#fsb{
  position:absolute; top:calc(10px + env(safe-area-inset-top, 0px)); right:max(12px, env(safe-area-inset-right, 0px));
  font:600 12px var(--mono); color:var(--accent); background:var(--panel); border:2px solid var(--accent);
  padding:6px 10px; cursor:pointer;
}
#fsb:hover, #fsb:focus-visible{ background:var(--accent); color:var(--panel); outline:none }
</style>

<script>
(()=>{
'use strict';
let W=240,H=400;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let K=1, RS=1;
const rnd=Math.random, TAU=Math.PI*2;
const rr=(a,b)=>a+rnd()*(b-a);

/* ---------- scaling ---------- */
const fsb=document.getElementById('fsb'), crt=document.getElementById('crt');
/* The canvas holds one game pixel per canvas pixel. Prefer a whole-number screen scale so every game pixel is the same size. */
function fit(){
  const vw=Math.max(100,document.body.clientWidth), vh=Math.max(100,document.body.clientHeight), asp=vw/vh;
  let w,h,s=0;
  for(const n of [Math.round(vh/400),Math.floor(vh/400),Math.ceil(vh/400)]){ if(n>=1&&vh/n>=340&&vh/n<=500&&vw/n>=240){ s=n; h=Math.floor(vh/n); w=Math.min(720,Math.floor(vw/n)); break; } }
  if(!s){ if(asp>=0.6){ h=400; w=Math.min(720,Math.round(400*asp)); } else { w=240; h=Math.min(580,Math.round(240/asp)); } s=Math.min(vw/w,vh/h); }
  w&=~1; h&=~1;
  const rs=Math.max(1,Math.min(4,s*(window.devicePixelRatio||1),Math.sqrt(9e6/(w*h))));
  if(w!==W||h!==H||!fit.done||Math.abs(rs-RS)>0.01){ if(w!==W||h!==H||!fit.done){ for(const q of stars){ q.x=rnd()*w; q.y=rnd()*h; } } W=w; H=h; fit.done=1; RS=rs; cv.width=Math.round(W*RS); cv.height=Math.round(H*RS); }
  cv.style.width=Math.floor(W*s)+'px'; cv.style.height=Math.floor(H*s)+'px';
  crt.style.backgroundSize='100% '+Math.max(2,s)+'px'; crt.style.opacity=s>=2?'1':'0.45';
}
function toggleFS(){ const d=document; try{ if(d.fullscreenElement) d.exitFullscreen(); else { const p=d.documentElement.requestFullscreen(); if(p&&p.catch)p.catch(()=>{}); } }catch(e){} }
fsb.addEventListener('click',()=>{ toggleFS(); fsb.blur(); });

/* ---------- cartoon art ---------- */
const INK='#1b1036';
/* Each sprite keeps its vector drawing. It is rasterised straight onto the game's pixel grid at the size it is used,
   then every pixel is made fully solid or fully empty, so edges are hard pixel-art edges at any scale. */
function rendSprite(s,k){
  const cw=Math.max(1,Math.round(s.pw*k)), ch=Math.max(1,Math.round(s.ph*k));
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const g=c.getContext('2d',{willReadFrequently:true});
  g.setTransform(k,0,0,k,cw/2,ch/2); g.lineJoin='round'; g.lineCap='round'; g.strokeStyle=INK; g.lineWidth=2.2; s.draw(g);
  const f=document.createElement('canvas'); f.width=cw; f.height=ch; const fg=f.getContext('2d');
  fg.drawImage(c,0,0); fg.globalCompositeOperation='source-in'; fg.fillStyle='#fff'; fg.fillRect(0,0,cw,ch);
  return {c,f,cw,ch};

    if(!pick){ const pool=avail.filter(s=>!out.includes(s)); pick=pool.length?pool[rnd()*pool.length|0]:SKK.heart; }
