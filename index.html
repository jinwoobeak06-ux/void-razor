<style>
/* Layout: one low-resolution arcade screen scaled up in whole pixels, with a CRT scanline and vignette overlay on top. */
:root{
  --bg:#05060f; --panel:#0b1026; --fg:#9fb4d8; --dim:#5a6e9c; --accent:#36e0ff; --hot:#ff4d6d;
  --mono: ui-monospace, "Cascadia Mono", "D2Coding", Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--mono);
  display:flex; align-items:center; justify-content:center;
  box-sizing:border-box; overflow:hidden; user-select:none; -webkit-user-select:none; position:relative;
}
#scr{ position:relative; line-height:0; }
#c{
  display:block; background:#000;
  touch-action:none; outline:none; max-width:100%;
  
}
#crt{
  position:absolute; inset:0; pointer-events:none; background-repeat:repeat;
  background-image:linear-gradient(to bottom, rgba(8,4,24,0) 0, rgba(8,4,24,0) 62%, rgba(8,4,24,.34) 62%, rgba(8,4,24,.34) 100%);
}
#crt::after{ content:""; position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(4,2,16,.5) 100%); }
#fsb{
  position:absolute; top:calc(10px + env(safe-area-inset-top, 0px)); right:max(12px, env(safe-area-inset-right, 0px));
  font:600 12px var(--mono); color:var(--accent); background:var(--panel); border:2px solid var(--accent);
  padding:6px 10px; cursor:pointer;
}
#fsb:hover, #fsb:focus-visible{ background:var(--accent); color:var(--panel); outline:none }
</style>

let W=240,H=400;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

const rnd=Math.random, TAU=Math.PI*2;
const rr=(a,b)=>a+rnd()*(b-a);

/* ---------- scaling ---------- */
const fsb=document.getElementById('fsb'), crt=document.getElementById('crt');
/* The canvas holds one game pixel per canvas pixel. Prefer a whole-number screen scale so every game pixel is the same size. */
function fit(){
  const vw=Math.max(100,document.body.clientWidth), vh=Math.max(100,document.body.clientHeight), asp=vw/vh;
  let w,h,s=0;
  for(const n of [Math.round(vh/400),Math.floor(vh/400),Math.ceil(vh/400)]){ if(n>=1&&vh/n>=340&&vh/n<=500&&vw/n>=240){ s=n; h=Math.floor(vh/n); w=Math.min(720,Math.floor(vw/n)); break; } }
  if(!s){ if(asp>=0.6){ h=400; w=Math.min(720,Math.round(400*asp)); } else { w=240; h=Math.min(580,Math.round(240/asp)); } s=Math.min(vw/w,vh/h); }
  w&=~1; h&=~1;
  const rs=Math.max(1,Math.min(4,s*(window.devicePixelRatio||1),Math.sqrt(9e6/(w*h))));
  if(w!==W||h!==H||!fit.done||Math.abs(rs-RS)>0.01){ if(w!==W||h!==H||!fit.done){ for(const q of stars){ q.x=rnd()*w; q.y=rnd()*h; } } W=w; H=h; fit.done=1; RS=rs; cv.width=Math.round(W*RS); cv.height=Math.round(H*RS); }
  cv.style.width=Math.floor(W*s)+'px'; cv.style.height=Math.floor(H*s)+'px';
  crt.style.backgroundSize='100% '+Math.max(2,s)+'px'; crt.style.opacity=s>=2?'1':'0.45';
}
function toggleFS(){ const d=document; try{ if(d.fullscreenElement) d.exitFullscreen(); else { const p=d.documentElement.requestFullscreen(); if(p&&p.catch)p.catch(()=>{}); } }catch(e){} }
fsb.addEventListener('click',()=>{ toggleFS(); fsb.blur(); });

/* ---------- cartoon art ---------- */
const INK='#1b1036';
/* Each sprite keeps its vector drawing. It is rasterised straight onto the game's pixel grid at the size it is used,

function rendSprite(s,k){
  const cw=Math.max(1,Math.round(s.pw*k)), ch=Math.max(1,Math.round(s.ph*k));
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const g=c.getContext('2d',{willReadFrequently:true});
  g.setTransform(k,0,0,k,cw/2,ch/2); g.lineJoin='round'; g.lineCap='round'; g.strokeStyle=INK; g.lineWidth=2.2; s.draw(g);
  const f=document.createElement('canvas'); f.width=cw; f.height=ch; const fg=f.getContext('2d');
  fg.drawImage(c,0,0); fg.globalCompositeOperation='source-in'; fg.fillStyle='#fff'; fg.fillRect(0,0,cw,ch);
  return {c,f,cw,ch};
}
function mkv(w,h,draw){ const s={w,h,pw:w+10,ph:h+10,draw,v:{}}, b=rendSprite(s,1); s.c=b.c; s.f=b.f; s.v[8]=b; return s; }
function drawS(s,x,y,flash,k,kx){
  const kk=k||1, q=Math.max(2,Math.round(kk*RS*8)); let b=s.v[q]; if(!b) b=s.v[q]=rendSprite(s,q/8);
  const dw=s.pw*kk*(kx||1), dh=s.ph*kk;
  ctx.drawImage(flash?b.f:b.c,x-dw/2,y-dh/2,dw,dh);
}
function P_(g,pts,fill,close,stroke){ g.beginPath(); g.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]); if(close!==false)g.closePath(); if(fill){ g.fillStyle=fill; g.fill(); } if(stroke!==false)g.stroke(); }
function B_(g,pts,fill,stroke){ const n=pts.length/2; g.beginPath(); g.moveTo((pts[0]+pts[2*n-2])/2,(pts[1]+pts[2*n-1])/2);
  for(let i=0;i<n;i++){ const x=pts[2*i],y=pts[2*i+1],j=(i+1)%n; g.quadraticCurveTo(x,y,(x+pts[2*j])/2,(y+pts[2*j+1])/2); }
  g.closePath(); if(fill){ g.fillStyle=fill; g.fill(); } if(stroke!==false)g.stroke(); }
function BS_(g,pts,fill,shade,cx,cy,cw,ch){ B_(g,pts,fill,false); g.save(); g.beginPath(); g.rect(cx,cy,cw,ch); g.clip(); B_(g,pts,shade,false); g.restore(); B_(g,pts,null,true); }

function RR_(g,x,y,w,h,r,fill,stroke){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); if(fill){ g.fillStyle=fill; g.fill(); } if(stroke!==false)g.stroke(); }
const M_=pts=>pts.map((v,i)=>i%2?v:-v);
const SY_=p=>{ const o=p.slice(); for(let i=p.length-2;i>=0;i-=2) if(p[i]!==0) o.push(-p[i],p[i+1]); return o; };
function L_(g,x1,y1,x2,y2){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
function LG_(g,x0,y0,x1,y1,...st){ const gr=g.createLinearGradient(x0,y0,x1,y1); st.forEach((c,i)=>gr.addColorStop(st.length>1?i/(st.length-1):0,c)); return gr; }

function EYE_(g,x,y,rx,ry){ const lw=g.lineWidth; g.lineWidth=1.6; E_(g,x,y,rx,ry,'#ffffff'); E_(g,x*0.8,y+1.3,rx*0.48,ry*0.48,INK,false); E_(g,x*0.8-0.8,y+0.3,rx*0.17,ry*0.17,'#ffffff',false); g.lineWidth=lw; }

function updEnemy(e){

    case 'blob': e.y+=0.95; e.x=e.x0+Math.sin(e.t*0.045+e.ph)*14; break;
    case 'mini': e.x+=e.vx; e.vx*=0.95; e.y+=e.vy; e.vy=Math.min(1.9,e.vy+0.12); break;
    case 'mine': e.y+=0.85; e.x=e.x0+Math.sin(e.t*0.03+e.ph)*10; break;

      if(e.t>400){ e.y-=2.2; if(e.y<-40)e.dead=true; }
      else if(e.st===0){ e.y+=2; if(e.y>=e.ty){ e.st=1; e.t0=e.t; } }

function startSlot(){
  if(slot)return; const N=SYM.length, r=rnd(), a=rnd()*N|0, b=rnd()*N|0, c=rnd()*N|0; let res;
  if(r<0.09) res=[a,a,a]; else if(r<0.45) res=[[a,a,b],[a,b,a],[b,a,a]][rnd()*3|0]; else res=[a,b,c];
  slot={t:0,res,next:0,rt:0,jack:false,reach:0,lines:[],coins:[],reels:[0,1,2].map(i=>({pos:rnd()*N,spd:0.42+i*0.06,target:-1,done:false,b:0}))};
  SFX.slotStart();
}
function grant(i){
  const k=SYM[i].k;
  if(k==='seven'){ P.bombs=Math.min(5,P.bombs+1); score+=5000; }
  else if(k==='heart'){ P.maxhp+=10; P.hp=Math.min(P.maxhp,P.hp+35); }
  else if(k==='shield'){ if(P.shield<3)P.shield++; else score+=3000; }
  else { if(U[k]<(CAP[k]||9))U[k]++; else score+=3000; }
}
function slotPay(s){
  const cnt={}; s.res.forEach(i=>cnt[i]=(cnt[i]||0)+1);
  const ks=Object.keys(cnt).map(Number).sort((p,q)=>cnt[q]-cnt[p]); s.jack=ks.length===1; P.hp=Math.min(P.maxhp,P.hp+10);
  for(const i of ks){ const n=[0,1,3,5][cnt[i]]; for(let j=0;j<n;j++)grant(i); s.lines.push([SYM[i].n+' +'+n,SYM[i].c]); }
  if(s.jack){ s.lines.push(['1UP  +20000','#ffe23f']); P.lives=Math.min(5,P.lives+1); score+=20000; flashA=1; addShake(10); SFX.jackpot(); confetti(90); }
  else if(ks.length===2){ s.lines.unshift(['PAIR BONUS!','#ffe23f']); flashA=0.35; SFX.pair(); confetti(30); }
  else SFX.win();
}
function updSlot(){
  const s=slot, N=SYM.length, pr=slotPress; slotPress=false; bombQ=false; s.t++;
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; if(p.k!==7)continue; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; if(--p.life<=0) parts.splice(i,1); }
  if(s.t===14) SFX.lever();
  if(s.t<20)return;
  const first=s.reels.findIndex(r=>!r.done);
  for(let i=0;i<3;i++){ const r=s.reels[i]; if(r.b>0)r.b--; if(r.done)continue; const pf=Math.floor(r.pos);
    if(r.target<0) r.pos+=r.spd;
    else { r.pos+=Math.min(r.spd,(r.target-r.pos)*0.3+0.02);
      if(r.target-r.pos<0.02){ r.pos=r.target; r.done=true; r.b=6; addShake(3); SFX.reelStop(i); } }
    if(i===first&&Math.floor(r.pos)!==pf) SFX.tick();
  }
  if(s.next<3&&((pr&&s.t>28&&!(s.reach&&s.t<s.reach+36))||s.t>62+s.next*24+(s.reach?64:0))){
    const r=s.reels[s.next]; let tg=Math.ceil(r.pos)+1+(s.reach?6:0); while(tg%N!==s.res[s.next])tg++; r.target=tg; s.next++;
    if(s.next===2&&s.res[0]===s.res[1]){ s.reach=s.t; s.reels[2].spd=0.26; SFX.reach(); } }
  if(!s.rt){ if(s.reels.every(r=>r.done)){ s.rt=1; slotPay(s); } }

    if(s.jack){ if(s.rt%2===0)s.coins.push({x:rr(0,W),y:-8,v:rr(3,6)}); for(const c of s.coins)c.y+=c.v; if(s.rt%6===0)SFX.coin(); if(s.rt%12===0)confetti(10); }

}

  box(x0,y0,PW,PH,6,'#ffc21f',4); ctx.fillStyle='#fff08a'; ctx.fillRect(x0+2,y0,PW-4,3); ctx.fillStyle='#e08a00'; ctx.fillRect(x0+2,y0+PH-3,PW-4,3);
  box(x0+8,y0+8,PW-16,PH-16,5,'#d92a4f',2); ctx.fillStyle='#f2456a'; ctx.fillRect(x0+10,y0+8,PW-20,3); ctx.fillStyle='#b81a3e'; ctx.fillRect(x0+8,y0+PH-70,PW-16,60);
  const sh=s.jack||s.reach?1:3; let bi=0;
  const bulb=(x,y)=>{ const on=((gf>>sh)+bi++)%2; if(on){ add(); glow(GL.yellow,x,y,7,0.7); nor(); } ctx.fillStyle=INK; ctx.fillRect(x-2,y-2,5,5); ctx.fillStyle=on?'#fffbe0':'#c98a00'; ctx.fillRect(x-1,y-1,3,3); };
  for(let x=x0+18;x<=x0+PW-17;x+=12){ bulb(x,y0+4); bulb(x,y0+PH-5); }
  for(let y=y0+20;y<=y0+PH-18;y+=12){ bulb(x0+4,y); bulb(x0+PW-5,y); }
  box(x0+26,y0+13,PW-52,24,5,'#2a154f',2);
  textG('LUCKY SLOT',cx,y0+18,'#fff7b0',(gf>>3)%2?'#ffb02e':'#ff7a2e',3,1);
  // reels
  const RW=52,RH=70,ry=y0+45;
  ctx.fillStyle=INK; ctx.fillRect(x0+13,ry-4,PW-26,RH+8);
  for(let i=0;i<3;i++){ const r=s.reels[i], rx=x0+17+i*(RW+7), cy=ry+RH/2+(r.b>3?3:r.b>0?-1:0);
    const win=s.rt&&(s.rt>>2)%2&&s.res.filter(v=>v===s.res[i]).length>1, hot=s.reach&&i===2&&!r.done;
    ctx.fillStyle=win?'#fff0a8':hot&&(gf>>1)%2?'#ffe0e0':'#ffffff'; ctx.fillRect(rx,ry,RW,RH);
    ctx.save(); ctx.beginPath(); ctx.rect(rx,ry,RW,RH); ctx.clip();
    const f=Math.floor(r.pos), fr=r.pos-f, fastSpin=!r.done&&(r.target<0||r.target-r.pos>1.2);
    for(let k=-1;k<=2;k++){ const id=((f+k)%N+N)%N, yy=Math.round(cy+(fr-k)*40);
      if(fastSpin){ drawSym(id,rx+RW/2,yy-9,0.25); drawSym(id,rx+RW/2,yy+9,0.25); drawSym(id,rx+RW/2,yy,0.75); } else drawSym(id,rx+RW/2,yy); }
    ctx.fillStyle='rgba(27,16,54,.45)'; ctx.fillRect(rx,ry,RW,4); ctx.fillRect(rx,ry+RH-4,RW,4); ctx.fillStyle='rgba(27,16,54,.2)'; ctx.fillRect(rx,ry+4,RW,6); ctx.fillRect(rx,ry+RH-10,RW,6);
    ctx.restore();
  }
  if(s.rt&&(s.rt>>2)%2){ add(); ctx.globalAlpha=0.8; ctx.fillStyle='#ffe23f'; ctx.fillRect(x0+15,ry+RH/2-1,PW-30,2); nor(); }
  ctx.fillStyle='#ffe23f'; for(let i=0;i<5;i++){ ctx.fillRect(x0+9+i,ry+RH/2-4+i,1,9-i*2); ctx.fillRect(x0+PW-10-i,ry+RH/2-4+i,1,9-i*2); }
  // display
  const ty=y0+PH-53; box(x0+14,ty,PW-28,39,3,'#2a0d1c',2);
  if(!s.rt&&s.reach){ if((gf>>2)%2) textG('CHANCE!!',cx,ty+12,'#fff7b0','#ffb02e',3,1); }
  else if(!s.rt){ if(s.t>22&&(gf>>3)%2) textO(usedTouch?'TAP TO STOP':'PRESS Z TO STOP',cx,ty+15,'#ffffff',2,1); }
  else s.lines.forEach((l,i)=>{ if(s.rt>i*8) textO(l[0],cx,ty+3+i*12+(3-s.lines.length)*6,l[1],2,1); });
  if(s.jack){ textL('JACKPOT!',Math.round(W/2),y0-34,'#fff7b0',(gf>>1)%2?'#ffb02e':'#ff3355',(gf>>3)%2?5:6);
    for(const c of s.coins){ circ(c.x,c.y,4,'#ffc21f',INK,2); ctx.fillStyle='#ffe98a'; ctx.fillRect(Math.round(c.x)-2,Math.round(c.y)-2,2,2); } }
}

/* ---------- loop ---------- */
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(100,ts-last); last=ts; acc+=dt; let n=0;
  while(acc>=16.6667&&n<4){ if(state==='title'){ gf++; scroll(1); } else tick(); acc-=16.6667; n++; }
  if(n){ render(); music(); fsb.hidden=state==='play'&&!paused; }
}
requestAnimationFrame(frame);
})();
</script>
